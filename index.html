<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UptimeHealth AI Initiatives Roadmap</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap" rel="stylesheet">
<style>
:root {
  --font: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --bg: #fafafa;
  --card-bg: #ffffff;
  --text: #1a1a1a;
  --text-muted: #888;
  --text-secondary: #555;
  --border: #e5e5e5;
  --green: #2E7D32;
  --green-light: #E8F5E9;
  --green-border: #43A047;
  --blue: #1565C0;
  --blue-light: #E3F2FD;
  --blue-border: #1E88E5;
  --orange: #E65100;
  --orange-light: #FFF3E0;
  --orange-border: #FB8C00;
  --purple: #6A1B9A;
  --purple-light: #F3E5F5;
  --purple-border: #8E24AA;
  --progress-gradient: linear-gradient(90deg, #43A047, #2E7D32);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 920px;
  margin: 0 auto;
  padding: 36px 24px;
}

h1 {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.5px;
  margin-bottom: 4px;
}

.subtitle {
  color: var(--text-muted);
  font-size: 15px;
  margin-bottom: 32px;
}

.progress-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px 24px;
  margin-bottom: 32px;
}

.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

.progress-header span:first-child { font-size: 15px; font-weight: 700; }
.progress-pct { font-size: 24px; font-weight: 800; color: var(--green); }

.progress-track {
  height: 10px;
  background: #eee;
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 16px;
}

.progress-fill {
  height: 100%;
  background: var(--progress-gradient);
  border-radius: 6px;
  transition: width 0.6s ease;
}

.progress-legend {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-secondary);
}

.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.filter-row {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
  align-items: center;
}

.filter-row:last-of-type { margin-bottom: 32px; }

.filter-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  min-width: 52px;
}

.filter-btn {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border);
  background: #fff;
  color: var(--text-secondary);
  font-family: var(--font);
  transition: all 0.12s ease;
}

.filter-btn:hover { border-color: #aaa; }

.filter-btn.active {
  border: 2px solid var(--text);
  background: var(--text);
  color: #fff;
}

.phase-group { margin-bottom: 36px; }

.phase-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.phase-badge {
  color: #fff;
  padding: 4px 12px;
  border-radius: 14px;
  font-size: 12px;
  font-weight: 600;
}

.phase-title { font-size: 16px; font-weight: 600; }
.phase-time { font-size: 13px; color: var(--text-muted); }

.card {
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 10px;
  cursor: pointer;
  background: var(--card-bg);
  transition: all 0.15s ease;
  position: relative;
  overflow: hidden;
}

.card:hover { border-color: #ccc; }

.card-stripe {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
}

.card-body { padding: 16px 20px 16px 24px; }

.card-main {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
}

.card-content { flex: 1; }

.card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
  flex-wrap: wrap;
}

.card-category {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.status-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 1px 8px;
  border-radius: 10px;
  border: 1px solid;
}

.status-complete { color: var(--green); background: #fff; border-color: var(--green-border); }
.status-in_progress { color: var(--orange); background: var(--orange-light); border-color: var(--orange-border); }
.status-not_started { color: var(--text-muted); background: #f5f5f5; border-color: #ddd; }

.card-name { font-size: 16px; font-weight: 600; line-height: 1.3; margin: 0; }
.card-name.complete { color: var(--green); }

.card-desc {
  font-size: 13.5px;
  color: var(--text-secondary);
  margin-top: 6px;
  line-height: 1.5;
}

.card-metrics {
  display: flex;
  gap: 20px;
  flex-shrink: 0;
  padding-top: 4px;
}

.metric { text-align: center; }

.metric-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 3px;
}

.metric-dots { font-size: 14px; letter-spacing: 1px; }
.metric-dots .filled { color: var(--text); }
.metric-dots .filled.muted { color: #aaa; }
.metric-dots .empty { color: #ddd; }

.metric-text { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

.metric-time { font-size: 13px; font-weight: 600; color: #333; }

.card.complete-card {
  background: var(--green-light);
  border-color: var(--green-border);
}

.card-expanded {
  padding: 0 20px 20px 24px;
  border-top: 1px solid rgba(0,0,0,0.06);
  display: none;
}

.card-expanded.show { display: block; }

.steps-title {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-secondary);
  margin: 16px 0 10px;
}

.step {
  display: flex;
  gap: 10px;
  margin-bottom: 8px;
  align-items: flex-start;
}

.step-number {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
  margin-top: 1px;
}

.step-number.complete-step { background: var(--green); font-size: 13px; }

.step-text { font-size: 13.5px; line-height: 1.5; color: #333; }

.value-box {
  margin-top: 16px;
  padding: 12px 14px;
  background: #fff;
  border-radius: 8px;
  border: 1px solid var(--border);
}

.value-label {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.value-text { font-size: 13.5px; color: #333; line-height: 1.5; }

.card-owner { margin-top: 10px; font-size: 12px; color: var(--text-muted); }

.info-box {
  margin-top: 40px;
  padding: 20px;
  border-radius: 12px;
  border: 1px solid;
}

.info-box.revops { background: #f8f8f8; border-color: var(--border); }

.info-box.principle {
  background: #FFFDE7;
  border-color: #FFF176;
  margin-top: 16px;
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
}

.info-box h3 { font-size: 15px; margin-bottom: 10px; }
.info-box p { font-size: 13.5px; color: var(--text-secondary); line-height: 1.6; }

.loading {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-muted);
}

.loading-spinner {
  width: 32px;
  height: 32px;
  border: 3px solid #eee;
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}

@keyframes spin { to { transform: rotate(360deg); } }

.error-box {
  text-align: center;
  padding: 60px 20px;
  color: #c62828;
}

.error-box h2 { margin-bottom: 10px; }
.error-box pre {
  background: #fff5f5;
  padding: 16px;
  border-radius: 8px;
  text-align: left;
  max-width: 600px;
  margin: 16px auto;
  font-size: 13px;
  overflow-x: auto;
}

.empty-state {
  text-align: center;
  padding: 40px;
  color: var(--text-muted);
  font-size: 15px;
}

@media (max-width: 700px) {
  .card-main { flex-direction: column; }
  .card-metrics { margin-top: 12px; }
  .progress-legend { gap: 16px; }
  h1 { font-size: 22px; }
}
</style>
</head>
<body>

<div class="container" id="app">
  <div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <div>Loading initiatives from Google Sheets...</div>
  </div>
</div>

<script>
// ============================================================
// YOUR GOOGLE SHEET ID (already configured)
// ============================================================
const SHEET_ID = '1sv5AwDuQB2HCFrRS9evhfK3JlmwBZGQa';
// ============================================================

const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Initiatives`;

const PHASE_CONFIG = {
  1: { bg: '#E8F5E9', border: '#43A047', badge: '#2E7D32', label: 'Quick Win', name: 'Phase 1 — Quick Wins', time: 'Weeks 1–4' },
  2: { bg: '#E3F2FD', border: '#1E88E5', badge: '#1565C0', label: 'Core Infra', name: 'Phase 2 — Core Infrastructure', time: 'Weeks 4–10' },
  3: { bg: '#FFF3E0', border: '#FB8C00', badge: '#E65100', label: 'Growth', name: 'Phase 3 — Growth Engines', time: 'Weeks 10–18' },
  4: { bg: '#F3E5F5', border: '#8E24AA', badge: '#6A1B9A', label: 'Advanced', name: 'Phase 4 — Advanced Capabilities', time: 'Weeks 18–30' }
};

const STATUS_ICONS = { complete: '✓', in_progress: '▶', not_started: '○' };
const STATUS_LABELS = { complete: 'Complete', in_progress: 'In Progress', not_started: 'Not Started' };
const EFFORT_LABELS = ['', 'Very Low', 'Low', 'Medium', 'High', 'Very High'];
const ROI_LABELS = ['', 'Low', 'Moderate', 'Good', 'High', 'Very High'];

let initiatives = [];
let state = { phase: 0, status: 'all', sort: 'default', expanded: null };

function dots(filled, muted) {
  let html = '';
  for (let i = 0; i < 5; i++) {
    const cls = i < filled ? (muted ? 'filled muted' : 'filled') : 'empty';
    html += `<span class="${cls}">●</span>`;
  }
  return html;
}

function getFiltered() {
  let items = [...initiatives];
  if (state.phase > 0) items = items.filter(i => i.phase === state.phase);
  if (state.status !== 'all') items = items.filter(i => i.status === state.status);

  items.sort((a, b) => {
    if (state.sort === 'roi') return b.roi - a.roi;
    if (state.sort === 'effort') return a.effort - b.effort;
    if (a.status === 'complete' && b.status !== 'complete') return -1;
    if (b.status === 'complete' && a.status !== 'complete') return 1;
    return a.id - b.id;
  });

  return items;
}

function groupByPhase(items) {
  const groups = {};
  items.forEach(item => {
    const phase = item.phase;
    if (!groups[phase]) groups[phase] = [];
    groups[phase].push(item);
  });
  return groups;
}

function renderCard(item) {
  const isComplete = item.status === 'complete';
  const isOpen = state.expanded === item.id;
  const pc = PHASE_CONFIG[item.phase] || PHASE_CONFIG[1];
  const stripeColor = isComplete ? '#2E7D32' : item.status === 'in_progress' ? '#E65100' : '#888';
  const cardClass = `card ${isComplete ? 'complete-card' : ''} ${isOpen ? 'expanded' : ''}`;
  const statusLabel = STATUS_ICONS[item.status] + ' ' + STATUS_LABELS[item.status] + (isComplete && item.completedDate ? ` — ${item.completedDate}` : '');

  let expandedHTML = '';
  if (isOpen) {
    const stepsHTML = item.steps.map((step, i) => {
      const numBg = isComplete ? '#2E7D32' : pc.badge;
      const numContent = isComplete ? '✓' : (i + 1);
      const numClass = isComplete ? 'step-number complete-step' : 'step-number';
      return `<div class="step">
        <span class="${numClass}" style="background:${numBg}">${numContent}</span>
        <span class="step-text">${step}</span>
      </div>`;
    }).join('');

    expandedHTML = `<div class="card-expanded show">
      <h4 class="steps-title">${isComplete ? 'What Was Delivered' : 'Step-by-Step Execution'}</h4>
      ${stepsHTML}
      <div class="value-box">
        <div class="value-label">Team Value</div>
        <div class="value-text">${item.value}</div>
      </div>
      <div class="card-owner"><strong>Owner:</strong> ${item.owner}</div>
    </div>`;
  }

  const bgStyle = isComplete ? `background:var(--green-light);border-color:var(--green-border);` : isOpen ? `background:${pc.bg};border-color:${pc.border};` : '';

  return `<div class="${cardClass}" style="${bgStyle}" onclick="toggleCard(${item.id})">
    <div class="card-stripe" style="background:${stripeColor}"></div>
    <div class="card-body">
      <div class="card-main">
        <div class="card-content">
          <div class="card-meta">
            <span class="card-category">${item.category}</span>
            <span class="status-badge status-${item.status}">${statusLabel}</span>
          </div>
          <h3 class="card-name ${isComplete ? 'complete' : ''}">${item.name}</h3>
          <p class="card-desc">${item.description}</p>
        </div>
        <div class="card-metrics">
          <div class="metric">
            <div class="metric-label">Effort</div>
            <div class="metric-dots">${dots(item.effort, isComplete)}</div>
            <div class="metric-text">${EFFORT_LABELS[item.effort]}</div>
          </div>
          <div class="metric">
            <div class="metric-label">ROI</div>
            <div class="metric-dots">${dots(item.roi, isComplete)}</div>
            <div class="metric-text">${ROI_LABELS[item.roi]}</div>
          </div>
          <div class="metric">
            <div class="metric-label">Time</div>
            <div class="metric-time">${item.time}</div>
          </div>
        </div>
      </div>
    </div>
    ${expandedHTML}
  </div>`;
}

function render() {
  const total = initiatives.length;
  const completed = initiatives.filter(i => i.status === 'complete').length;
  const inProgress = initiatives.filter(i => i.status === 'in_progress').length;
  const notStarted = initiatives.filter(i => i.status === 'not_started').length;
  const pct = total ? Math.round((completed / total) * 100) : 0;

  const filtered = getFiltered();
  const groups = groupByPhase(filtered);

  const phaseButtons = [
    { l: 'All', v: 0 }, { l: 'Quick Wins', v: 1 }, { l: 'Core Infra', v: 2 }, { l: 'Growth', v: 3 }, { l: 'Advanced', v: 4 }
  ].map(b => `<button class="filter-btn ${state.phase === b.v ? 'active' : ''}" onclick="setFilter('phase',${b.v})">${b.l}</button>`).join('');

  const statusButtons = [
    { l: 'All', v: 'all' }, { l: '✓ Complete', v: 'complete' }, { l: '▶ In Progress', v: 'in_progress' }, { l: 'Not Started', v: 'not_started' }
  ].map(b => `<button class="filter-btn ${state.status === b.v ? 'active' : ''}" onclick="setFilter('status','${b.v}')">${b.l}</button>`).join('');

  const sortButtons = [
    { l: 'Roadmap Order', v: 'default' }, { l: 'Highest ROI', v: 'roi' }, { l: 'Lowest Effort', v: 'effort' }
  ].map(b => `<button class="filter-btn ${state.sort === b.v ? 'active' : ''}" onclick="setFilter('sort','${b.v}')">${b.l}</button>`).join('');

  let cardsHTML = '';
  [1, 2, 3, 4].forEach(p => {
    if (!groups[p]) return;
    const pc = PHASE_CONFIG[p];
    cardsHTML += `<div class="phase-group">
      <div class="phase-header">
        <span class="phase-badge" style="background:${pc.badge}">${pc.label}</span>
        <span class="phase-title">${pc.name}</span>
        <span class="phase-time">${pc.time}</span>
      </div>
      ${groups[p].map(renderCard).join('')}
    </div>`;
  });

  if (!cardsHTML) cardsHTML = '<div class="empty-state">No initiatives match the current filters.</div>';

  document.getElementById('app').innerHTML = `
    <h1>UptimeHealth AI Initiatives Roadmap</h1>
    <p class="subtitle">${total} initiatives across 4 phases</p>

    <div class="progress-card">
      <div class="progress-header">
        <span>Overall Progress</span>
        <span class="progress-pct">${pct}%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>
      <div class="progress-legend">
        <div class="legend-item"><div class="legend-dot" style="background:#2E7D32"></div><strong>${completed}</strong>&nbsp;Complete</div>
        <div class="legend-item"><div class="legend-dot" style="background:#FB8C00"></div><strong>${inProgress}</strong>&nbsp;In Progress</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ccc"></div><strong>${notStarted}</strong>&nbsp;Not Started</div>
      </div>
    </div>

    <div class="filter-row">
      <span class="filter-label">Phase</span>${phaseButtons}
    </div>
    <div class="filter-row">
      <span class="filter-label">Status</span>${statusButtons}
    </div>
    <div class="filter-row" style="margin-bottom:32px">
      <span class="filter-label">Sort</span>${sortButtons}
    </div>

    ${cardsHTML}

    <div class="info-box revops">
      <h3>Russ's RevOps Agent Architecture — Threaded Throughout</h3>
      <p>The multi-agent RevOps vision (Data Agent, Reporting Agent, Pipeline Agent, Growth Agent) isn't a separate initiative — it's the architecture that emerges as you build Phases 1–3. The Data Agent is the CRM Hygiene project. The Reporting Agent is the Partner Health + content reports. The Pipeline Agent is the MQL→SQL automation. The Growth Agent is the marketing optimization + service org research.</p>
    </div>

    <div class="info-box principle">
      <strong>Key principle:</strong> Each phase delivers standalone value, but also lays infrastructure for the next. Phase 1 quick wins build team confidence and data foundations. Phase 2 creates the pipes. Phase 3 turns those pipes into growth engines. Phase 4 builds competitive moats. Don't skip ahead — the compounding is the strategy.
    </div>
  `;
}

function toggleCard(id) {
  state.expanded = state.expanded === id ? null : id;
  render();
}

function setFilter(key, val) {
  state[key] = val;
  render();
}

function loadData() {
  Papa.parse(SHEET_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      if (results.errors.length > 0 && results.data.length === 0) {
        document.getElementById('app').innerHTML = `
          <div class="error-box">
            <h2>Failed to load data</h2>
            <p>Could not fetch data from Google Sheets. Make sure:</p>
            <p>1. The sheet is published to web (File → Share → Publish to web)<br>
            2. The Sheet ID is correct<br>
            3. The sheet name is "Initiatives"</p>
          </div>`;
        return;
      }
      initiatives = results.data.map(row => ({
        id: parseInt(row['ID']) || 0,
        phase: parseInt(row['Phase']) || 1,
        name: (row['Initiative Name'] || '').trim(),
        category: (row['Category'] || '').trim(),
        owner: (row['Owner'] || '').trim(),
        effort: parseInt(row['Effort (1-5)']) || 1,
        time: (row['Time Estimate'] || '').trim(),
        roi: parseInt(row['ROI (1-5)']) || 1,
        status: (row['Status'] || 'not_started').trim().toLowerCase().replace(/ /g, '_'),
        completedDate: (row['Completed Date'] || '').trim(),
        description: (row['Description'] || '').trim(),
        steps: (row['Steps (separate with |)'] || '').split('|').map(s => s.trim()).filter(Boolean),
        value: (row['Team Value'] || '').trim()
      })).filter(i => i.name);
      render();
    },
    error: function(err) {
      document.getElementById('app').innerHTML = `
        <div class="error-box">
          <h2>Connection Error</h2>
          <p>Could not reach Google Sheets. Check your internet connection and Sheet ID.</p>
        </div>`;
    }
  });
}

loadData();
</script>
</body>
</html>
