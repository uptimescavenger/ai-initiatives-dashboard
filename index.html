<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UptimeHealth AI Initiatives Roadmap</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
  <style>
:root {
  --font: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --bg: #fafafa;
  --card-bg: #ffffff;
  --text: #1a1a1a;
  --text-muted: #888;
  --text-secondary: #555;
  --border: #e5e5e5;
  --green: #2E7D32;
  --green-light: #E8F5E9;
  --green-border: #43A047;
  --blue: #1565C0;
  --blue-light: #E3F2FD;
  --blue-border: #1E88E5;
  --orange: #E65100;
  --orange-light: #FFF3E0;
  --orange-border: #FB8C00;
  --purple: #6A1B9A;
  --purple-light: #F3E5F5;
  --purple-border: #8E24AA;
  --pink: #AD1457;
  --pink-light: #FCE4EC;
  --pink-border: #E91E63;
  --gray: #455A64;
  --gray-light: #ECEFF1;
  --gray-border: #78909C;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font); background:var(--bg); color:var(--text); line-height:1.5; }
.container { max-width:880px; margin:0 auto; padding:28px 16px; }
h1 { font-size:24px; font-weight:800; letter-spacing:-0.5px; }
.subtitle { color:var(--text-muted); font-size:14px; margin:4px 0 24px; }
.progress-box { background:var(--card-bg); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:20px; }
.progress-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.progress-label { font-size:14px; font-weight:700; }
.progress-pct { font-size:13px; font-weight:700; color:var(--green); }
.progress-bar { height:8px; background:#f0f0f0; border-radius:4px; overflow:hidden; margin-bottom:16px; }
.progress-fill { height:100%; background:linear-gradient(90deg,#43A047,#2E7D32); border-radius:4px; transition:width .5s ease; }
.status-row { display:flex; gap:12px; flex-wrap:wrap; }
.status-badge { display:flex; align-items:center; gap:6px; font-size:13px; }
.status-icon { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:4px; font-size:11px; font-weight:700; }
.q2-banner { background:#FFF8E1; border:1px solid #FFD54F; border-radius:10px; padding:12px 16px; margin-bottom:20px; font-size:13px; color:#5D4037; line-height:1.6; }
.q2-badge { background:var(--orange-light); padding:1px 6px; border-radius:4px; font-weight:600; color:var(--orange); }
.filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
.filters select { padding:6px 12px; border-radius:8px; border:1px solid #ddd; font-size:13px; background:#fff; cursor:pointer; font-family:var(--font); }
.phase-header { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.phase-title { font-size:15px; font-weight:700; }
.phase-time { font-size:12px; color:#999; }
.phase-count { font-size:12px; color:#aaa; }
.card { background:var(--card-bg); border:1px solid var(--border); border-radius:10px; margin-bottom:8px; cursor:pointer; overflow:hidden; transition:box-shadow .15s ease; }
.card:hover { box-shadow:0 2px 8px rgba(0,0,0,.06); }
.card-header { padding:14px 16px; display:flex; align-items:flex-start; gap:12px; }
.card-arrow { font-size:11px; margin-top:2px; color:#bbb; }
.card-body { flex:1; min-width:0; }
.card-title-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:4px; }
.card-name { font-size:14.5px; font-weight:600; color:var(--text); }
.card-status { font-size:11px; padding:2px 8px; border-radius:4px; font-weight:600; }
.card-meta { display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--text-muted); }
.card-detail { padding:0 16px 16px 38px; border-top:1px solid #f0f0f0; }
.submitter-box { margin-top:12px; padding:8px 12px; background:#FFF8E1; border-radius:6px; font-size:12px; color:#5D4037; }
.card-desc { font-size:13.5px; color:#444; margin-top:12px; line-height:1.6; }
.steps-label { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text-muted); margin-bottom:8px; margin-top:14px; }
.step { display:flex; gap:8px; margin-bottom:6px; font-size:13px; color:#333; }
.step-num { font-weight:600; min-width:18px; }
.value-box { margin-top:14px; padding:10px 12px; background:#fafafa; border-radius:6px; border:1px solid #eee; }
.value-label { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text-muted); margin-bottom:4px; }
.value-text { font-size:13px; color:#444; line-height:1.5; }
.owner-line { margin-top:8px; font-size:12px; color:var(--text-muted); }
.arch-box { margin-top:32px; padding:18px; background:#f8f8f8; border-radius:10px; border:1px solid var(--border); }
.arch-box h3 { font-size:14px; font-weight:700; margin-bottom:8px; }
.arch-box p { font-size:13px; color:var(--text-secondary); line-height:1.6; }
.setup-msg { text-align:center; padding:60px 20px; }
.setup-msg h2 { font-size:20px; margin-bottom:12px; }
.setup-msg p { color:var(--text-muted); font-size:14px; line-height:1.8; max-width:500px; margin:0 auto; }
.loading { text-align:center; padding:60px; font-size:15px; color:var(--text-muted); }
.phase-group { margin-bottom:28px; }
  </style>
</head>
<body>
<div class="container" id="app">
  <div class="loading">Loading initiatives from Google Sheets...</div>
</div>
<script>
const SHEET_ID = '1RI3C7bPSFU7S9zAPtx2hKNZRSG8ha_UAokrWJR0_clo';
const SHEET_NAME = 'Initiatives';
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;

const PHASE_CFG = {
  1:{text:'#1565C0',label:'Phase 1 \u2014 Quick Wins',time:'Weeks 1\u20134'},
  2:{text:'#E65100',label:'Phase 2 \u2014 Core Infrastructure',time:'Weeks 4\u201310'},
  3:{text:'#6A1B9A',label:'Phase 3 \u2014 Growth Engines',time:'Weeks 10\u201318'},
  4:{text:'#AD1457',label:'Phase 4 \u2014 Advanced Capabilities',time:'Weeks 18\u201330'},
  5:{text:'#455A64',label:'Backlog \u2014 Operational Improvements',time:'Prioritize as needed'}
};
const STATUS_CFG = {
  complete:{label:'Complete',color:'#2E7D32',bg:'#E8F5E9',icon:'\u2713'},
  in_progress:{label:'In Progress',color:'#1565C0',bg:'#E3F2FD',icon:'\u25B6'},
  under_review:{label:'Under Review',color:'#E65100',bg:'#FFF3E0',icon:'\u25CE'},
  not_started:{label:'Not Started',color:'#78909C',bg:'#ECEFF1',icon:'\u25CB'}
};

let allData = [];
let expanded = null;

function fetchData() {
  Papa.parse(CSV_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      allData = results.data.filter(r => r['ID'] && r['Initiative Name']);
      render();
    },
    error: function() {
      document.getElementById('app').innerHTML = `<div class="setup-msg"><h2>\u2699\uFE0F Connect Your Google Sheet</h2><p>Could not load data. Make sure the sheet is published to the web (File \u2192 Share \u2192 Publish to web) as CSV format for the "Initiatives" sheet.</p></div>`;
    }
  });
}

function render(phaseFilter, statusFilter, sortBy) {
  phaseFilter = phaseFilter || 'all';
  statusFilter = statusFilter || 'all';
  sortBy = sortBy || 'phase';

  let items = allData.map(r => ({
    id: r['ID'],
    phase: parseInt(r['Phase']) || 1,
    name: r['Initiative Name'] || '',
    category: r['Category'] || '',
    owner: r['Owner'] || '',
    effort: parseInt(r['Effort (1-5)']) || 1,
    time: r['Time Estimate'] || '',
    roi: parseInt(r['ROI (1-5)']) || 1,
    status: (r['Status'] || 'not_started').trim(),
    completedDate: r['Completed Date'] || '',
    description: r['Description'] || '',
    steps: (r['Steps (separate with |)'] || '').split('|').filter(s => s.trim()),
    value: r['Team Value'] || '',
    submittedBy: r['Submitted By (Q2 Ops)'] || ''
  }));

  let filtered = items.filter(i => {
    if (phaseFilter !== 'all' && i.phase !== parseInt(phaseFilter)) return false;
    if (statusFilter !== 'all' && i.status !== statusFilter) return false;
    return true;
  });

  if (sortBy === 'roi') filtered.sort((a,b) => b.roi - a.roi);
  else if (sortBy === 'effort') filtered.sort((a,b) => a.effort - b.effort);
  else filtered.sort((a,b) => a.phase - b.phase || parseInt(a.id) - parseInt(b.id));

  const total = items.length;
  const complete = items.filter(i => i.status === 'complete').length;
  const inProgress = items.filter(i => i.status === 'in_progress').length;
  const underReview = items.filter(i => i.status === 'under_review').length;
  const notStarted = items.filter(i => i.status === 'not_started').length;
  const pct = total ? Math.round((complete/total)*100) : 0;
  const q2Count = items.filter(i => i.submittedBy).length;
  const phases = [...new Set(items.map(i => i.phase))].sort((a,b) => a - b);

  // Group
  const grouped = {};
  filtered.forEach(i => {
    const cfg = PHASE_CFG[i.phase] || PHASE_CFG[4];
    const key = i.phase;
    if (!grouped[key]) grouped[key] = {phase:i.phase, label:cfg.label, time:cfg.time, color:cfg.text, items:[]};
    // Separate completed items
    if (i.status === 'complete' && phaseFilter === 'all' && statusFilter === 'all') {
      if (!grouped[0]) grouped[0] = {phase:0, label:'Completed', time:'', color:'#2E7D32', items:[]};
      grouped[0].items.push(i);
    } else {
      grouped[key].items.push(i);
    }
  });
  // Remove empty phase groups that lost items to "Completed"
  Object.keys(grouped).forEach(k => { if (grouped[k].items.length === 0) delete grouped[k]; });

  let html = `<h1>AI & Automation Initiatives Roadmap</h1>
<p class="subtitle">UptimeHealth \u2014 ${total} initiatives across ${phases.length} phases \u2022 Live from Google Sheets</p>
<div class="progress-box">
  <div class="progress-header"><span class="progress-label">Overall Progress</span><span class="progress-pct">${complete}/${total} complete (${pct}%)</span></div>
  <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
  <div class="status-row">`;

  [{k:'complete',c:complete},{k:'in_progress',c:inProgress},{k:'under_review',c:underReview},{k:'not_started',c:notStarted}].forEach(s => {
    const cfg = STATUS_CFG[s.k];
    html += `<div class="status-badge"><span class="status-icon" style="background:${cfg.bg};color:${cfg.color}">${cfg.icon}</span><span style="color:#555">${cfg.label}: <strong style="color:${cfg.color}">${s.c}</strong></span></div>`;
  });

  html += `</div></div>`;

  if (q2Count > 0) {
    html += `<div class="q2-banner"><strong>Q2 Update:</strong> ${q2Count} submissions from the Operations team integrated. Overlapping ideas combined. All new items marked <span class="q2-badge">Under Review</span>. Expand any item to see the original submitter(s).</div>`;
  }

  html += `<div class="filters">
    <select id="phaseFilter" onchange="applyFilters()">
      <option value="all">All Phases</option>`;
  phases.forEach(p => {
    const cfg = PHASE_CFG[p] || {label:'Phase '+p};
    html += `<option value="${p}" ${phaseFilter==p?'selected':''}>${cfg.label.split(' \u2014 ')[0] || cfg.label}</option>`;
  });
  html += `</select>
    <select id="statusFilter" onchange="applyFilters()">
      <option value="all">All Statuses</option>`;
  Object.entries(STATUS_CFG).forEach(([k,v]) => {
    html += `<option value="${k}" ${statusFilter==k?'selected':''}>${v.label}</option>`;
  });
  html += `</select>
    <select id="sortBy" onchange="applyFilters()">
      <option value="phase" ${sortBy=='phase'?'selected':''}>Sort: Phase Order</option>
      <option value="roi" ${sortBy=='roi'?'selected':''}>Sort: Highest ROI</option>
      <option value="effort" ${sortBy=='effort'?'selected':''}>Sort: Lowest Effort</option>
    </select>
  </div>`;

  const sortedKeys = Object.keys(grouped).sort((a,b) => parseInt(a) - parseInt(b));
  sortedKeys.forEach(key => {
    const g = grouped[key];
    html += `<div class="phase-group"><div class="phase-header">
      <span class="phase-title" style="color:${g.color}">${g.label}</span>
      ${g.time ? `<span class="phase-time">${g.time}</span>` : ''}
      <span class="phase-count">(${g.items.length} items)</span>
    </div>`;

    g.items.forEach(item => {
      const sc = STATUS_CFG[item.status] || STATUS_CFG.not_started;
      const isOpen = expanded === item.id;
      const dots = n => '\u25CF'.repeat(n) + '\u25CB'.repeat(5-n);
      const stars = n => '\u2605'.repeat(n) + '\u2606'.repeat(5-n);

      html += `<div class="card" style="border-left:4px solid ${sc.color}" onclick="toggle('${item.id}')">
        <div class="card-header">
          <span class="card-arrow">${isOpen?'\u25BC':'\u25B6'}</span>
          <div class="card-body">
            <div class="card-title-row">
              <span class="card-name">${item.name}</span>
              <span class="card-status" style="background:${sc.bg};color:${sc.color}">${sc.label}${item.completedDate?' \u2014 '+item.completedDate:''}</span>
            </div>
            <div class="card-meta">
              <span>${item.category}</span>
              <span>Effort: ${dots(item.effort)}</span>
              <span>ROI: ${stars(item.roi)}</span>
              <span>${item.time}</span>
            </div>
          </div>
        </div>`;

      if (isOpen) {
        html += `<div class="card-detail">`;
        if (item.submittedBy) {
          html += `<div class="submitter-box"><strong>Submitted by:</strong> ${item.submittedBy}</div>`;
        }
        html += `<p class="card-desc">${item.description}</p>`;
        html += `<div class="steps-label">${item.status==='complete'?'What Was Delivered':'Step-by-Step Execution'}</div>`;
        item.steps.forEach((step, i) => {
          html += `<div class="step"><span class="step-num" style="color:${item.status==='complete'?'#2E7D32':'#bbb'}">${item.status==='complete'?'\u2713':(i+1)+'.'}</span><span>${step.trim()}</span></div>`;
        });
        html += `<div class="value-box"><div class="value-label">Value</div><p class="value-text">${item.value}</p></div>`;
        html += `<div class="owner-line"><strong>Owner:</strong> ${item.owner}</div>`;
        html += `</div>`;
      }
      html += `</div>`;
    });
    html += `</div>`;
  });

  html += `<div class="arch-box"><h3>RevOps Agent Architecture \u2014 Threaded Throughout</h3><p>The multi-agent RevOps vision (Data Agent, Reporting Agent, Pipeline Agent, Growth Agent) isn't a separate initiative \u2014 it's the architecture that emerges as you build Phases 1\u20133. The Data Agent is the CRM Hygiene project. The Reporting Agent is the Partner Health + content reports. The Pipeline Agent is the MQL\u2192SQL automation. The Growth Agent is the marketing optimization + service org research.</p></div>`;

  document.getElementById('app').innerHTML = html;
}

function toggle(id) {
  expanded = expanded === id ? null : id;
  applyFilters();
}

function applyFilters() {
  const pf = document.getElementById('phaseFilter')?.value || 'all';
  const sf = document.getElementById('statusFilter')?.value || 'all';
  const sb = document.getElementById('sortBy')?.value || 'phase';
  render(pf, sf, sb);
}

fetchData();
</script>
</body>
</html>
